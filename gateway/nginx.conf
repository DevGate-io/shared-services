# Встроенный DNS Docker. Вместе с переменной в proxy_pass это откладывает
# резолв имён апстримов на момент запроса, поэтому nginx стартует, даже если
# какой-то сервис ещё не поднялся (вместо падения — 502 на его путях).
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

server {
    listen 80;
    server_name api.devgate.gateway.local;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    location ~ ^/(users|auth|teams) {
        set $user_service devgate-user-service;
        proxy_pass http://$user_service:8081$request_uri;
    }

    location ~ ^/audit {
        set $audit_service devgate-audit-service;
        proxy_pass http://$audit_service:8082$request_uri;
    }

    # Явно возвращаем 404 для всех остальных путей
    location / {
        return 404;
    }
}

server {
    listen 80;
    server_name api.devgate.users.local;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location / {
        set $user_service devgate-user-service;
        proxy_pass http://$user_service:8081$request_uri;
    }
}

server {
    listen 80;
    server_name api.devgate.audit.local;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    location / {
        set $audit_service devgate-audit-service;
        proxy_pass http://$audit_service:8082$request_uri;
    }
}
